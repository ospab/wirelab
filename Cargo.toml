[workspace]
resolver = "2"
members = ["wirelab-core", "wirelab-wire", "wirelab-sim", "wirelab-ostp", "wirelab-lab", "wirelab-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[workspace.dependencies]
wirelab-core = { path = "wirelab-core" }
wirelab-wire = { path = "wirelab-wire" }
wirelab-sim = { path = "wirelab-sim" }
wirelab-ostp = { path = "wirelab-ostp" }
wirelab-lab = { path = "wirelab-lab" }
# The OSTP adapter drives the real protocol core: a reimplementation would
# only test itself. To build against a local checkout instead, add to
# .cargo/config.toml:  [patch."https://github.com/ospab/ostp"] ostp-core = { path = "../ostp/ostp-core" }
ostp-core = { git = "https://github.com/ospab/ostp", tag = "v0.4.7-beta.14" }

anyhow = "1.0"
bytes = "1.6"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.5"
clap = { version = "4", features = ["derive"] }
# 0.7 rather than 0.8: its WebSocket stack (tokio-tungstenite 0.24) is what
# the offline cache holds.
axum = { version = "=0.7.9", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
