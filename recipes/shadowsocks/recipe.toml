name = "shadowsocks"
about = "Shadowsocks (shadowsocks-rust), TCP and UDP, an AEAD-2022 method by default"
base = "alpine"
proxy = "socks5h://127.0.0.1:1080"
server_process = "ssserver"
client_process = "sslocal"
version_param = "version"

[params]
version = "v1.25.0"
src = "https://github.com/shadowsocks/shadowsocks-rust/releases/download/${version}/shadowsocks-${version}.x86_64-unknown-linux-musl.tar.xz"
# 2022-blake3-aes-128-gcm, 2022-blake3-aes-256-gcm, 2022-blake3-chacha20-poly1305,
# or a classic one (aes-256-gcm, chacha20-ietf-poly1305) with any password.
method = "2022-blake3-aes-128-gcm"
# Hex. For the 2022 methods it is the key and must be 16 bytes (aes-128) or
# 32 bytes (the others); a classic method takes it as the password.
key = "@random-hex-16"

[[fetch]]
url = "${src}"
save_as = "ss.tar.xz"
