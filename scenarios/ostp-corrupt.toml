name = "ostp-corrupt"
description = "1% bit flips both ways: every corrupted datagram must be rejected, the stream must stay intact."
duration_ms = 15_000

[protocol]
name = "ostp"

[wire]
latency_ms = 15.0
corrupt = 0.01
impair_from_ms = 100.0

[[transfer]]
from = "client"
bytes = 3_000_000

[[transfer]]
from = "server"
bytes = 3_000_000
