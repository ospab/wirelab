<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wirelab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
:root {
  --paper: #f4f1ea; --ink: #1d1c1a; --text: #1d1c1a; --muted: #6b665c; --rule: #cfc8b8;
  --c2s: #b5651d; --s2c: #2f6f73; --alarm: #a3271f; --field: #fbf9f4;
  --sans: "IBM Plex Sans", sans-serif; --mono: "IBM Plex Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #191816; --text: #e8e3d8; --muted: #9a948a; --rule: #3a3732;
          --c2s: #d08a4a; --s2c: #5fa3a6; --alarm: #e0574d; --field: #22211e; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--text); font: 14px/1.45 var(--sans); }
:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
.lab { display: grid; height: 100vh;
       grid-template-columns: var(--w-client, minmax(0, 1fr)) 7px var(--w-wire, 400px) 7px minmax(0, 1fr); }
.zone { display: flex; flex-direction: column; min-width: 0; }
/* Column dividers: drag, or focus and use the arrow keys. */
.splitter { cursor: col-resize; background: var(--paper); border-left: 1px solid var(--rule); touch-action: none; }
.splitter:hover, .splitter:focus-visible, .splitter.dragging { background: var(--rule); outline: none; }
.term-note { color: var(--alarm); }
.zone-head { padding: 10px 14px 8px; border-bottom: 1px solid var(--rule); }
.zone-head h2 { margin: 0; font-size: 15px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
.zone-head .addr { font: 13px var(--mono); color: var(--muted); }
.zone-head .folder { font: 12px var(--mono); color: var(--muted); word-break: break-all; }
.endpoint { font: 13px var(--mono); margin: 4px 0 2px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.endpoint b { font-weight: 500; }
.endpoint .st { font: 12px var(--sans); color: var(--muted); }
.endpoint .st.on { color: var(--text); }
#client h2 { color: var(--c2s); } #server h2 { color: var(--s2c); }
.term { flex: 1; min-height: 0; background: var(--ink); padding: 6px 0 0 8px; }
.zone-foot { display: flex; gap: 10px; align-items: center; padding: 6px 14px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--muted); }
button { font: 500 13px var(--sans); color: var(--text); background: transparent; border: 1px solid var(--rule); border-radius: 2px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--text); }
input, textarea { font: 13px var(--mono); color: var(--text); background: var(--field); border: 1px solid var(--rule); border-radius: 2px; padding: 3px 6px; }
#wire { overflow-y: auto; }
section { padding: 10px 14px; border-bottom: 1px solid var(--rule); }
section h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
.meta { font: 12px var(--mono); color: var(--muted); word-break: break-all; }
.counts { display: grid; grid-template-columns: auto 1fr 1fr; gap: 2px 12px; font: 13px var(--mono); font-variant-numeric: tabular-nums; }
.counts .h { color: var(--muted); font: 12px var(--sans); }
.c2s { color: var(--c2s); } .s2c { color: var(--s2c); }
.netem { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 8px; margin-top: 4px; }
.netem label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); }
.netem input { width: 100%; margin-top: 2px; }
.dirblock + .dirblock { margin-top: 12px; }
.dirblock .row { display: flex; justify-content: space-between; align-items: center; }
.tc { font: 12px var(--mono); color: var(--muted); margin-top: 4px; word-break: break-all; }
.err { color: var(--alarm); font-size: 12px; }
.hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
textarea { width: 100%; height: 54px; resize: vertical; }
#alarms div { color: var(--alarm); font: 12px var(--mono); margin-top: 3px; }
select { font: 13px var(--sans); color: var(--text); background: var(--field); border: 1px solid var(--rule); border-radius: 2px; padding: 3px 6px; }
.rules { margin: 8px 0 0; padding: 0; list-style: none; }
.rules li { display: grid; grid-template-columns: 18px 1fr; gap: 2px 6px; padding: 4px 0; border-top: 1px solid var(--rule); font-size: 13px; }
.rules li:first-child { border-top: 0; }
.rules .src { grid-column: 2; font-size: 12px; color: var(--muted); }
.rules .src a { color: var(--muted); }
#censor-log { margin-top: 8px; font: 12px/1.5 var(--mono); max-height: 220px; overflow-y: auto; }
#censor-log div { padding: 2px 0 2px 6px; border-left: 2px solid var(--rule); margin-top: 2px; }
#censor-log .hit { border-left-color: var(--alarm); }
#censor-log .hit .what { color: var(--alarm); }
#censor-log .meta { color: var(--muted); }
#feed { font: 12px/1.5 var(--mono); font-variant-numeric: tabular-nums; }
#feed .p { display: grid; grid-template-columns: 52px 64px 34px 40px 40px 1fr; gap: 6px; padding-left: 6px; border-left: 2px solid transparent; white-space: nowrap; }
#feed .p.c2s { border-left-color: var(--c2s); } #feed .p.s2c { border-left-color: var(--s2c); }
#feed .p > span { overflow: hidden; text-overflow: ellipsis; color: var(--text); }
#feed .p .d { color: inherit; }
#feed .note { grid-column: 2 / -1; white-space: normal; color: var(--muted); }
#feed .p.alarm .note { color: var(--alarm); }
#feed .gap { color: var(--muted); padding-left: 8px; }
@media (max-width: 900px) {
  .lab { grid-template-columns: 1fr; height: auto; }
  .splitter { display: none; }
  .zone + .zone, .splitter + .zone { border-left: 0; border-top: 1px solid var(--rule); }
  .term { height: 360px; flex: none; }
  #wire { overflow: visible; }
}
</style>
</head>
<body>
<main class="lab">
  <div class="zone" id="client">
    <div class="zone-head">
      <h2>Client <span class="addr" id="client-ip"></span></h2>
      <div class="endpoint">connect to <b id="client-connect"></b><span class="st" id="client-status"></span></div>
      <div class="folder" id="client-folder"></div>
    </div>
    <div class="term" id="term-client"></div>
    <div class="zone-foot"><button data-reconnect="client">Reconnect</button><span id="client-state"></span></div>
  </div>
  <div class="splitter" role="separator" aria-orientation="vertical" tabindex="0" data-split="client"
       aria-label="Width of the client column"></div>

  <div class="zone" id="wire">
    <section>
      <div class="meta" id="lab-meta"></div>
      <div class="meta" id="capture-state"></div>
    </section>
    <section>
      <h3>Wire</h3>
      <div class="counts">
        <span class="h"></span><span class="h">packets</span><span class="h">IP bytes</span>
        <span class="c2s">c→s</span><span id="c2s-p">0</span><span id="c2s-b">0</span>
        <span class="s2c">s→c</span><span id="s2c-p">0</span><span id="s2c-b">0</span>
      </div>
      <p class="hint">Captured on the client side: c→s as the client sent it, s→c after impairments.</p>
    </section>
    <section id="censor">
      <h3>Censor</h3>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="censor-preset" aria-label="Censor preset"><option value="">Off</option></select>
        <button id="censor-apply">Apply</button>
      </div>
      <div class="err" id="censor-err"></div>
      <p class="hint" id="censor-notes"></p>
      <ul class="rules" id="censor-hyps"></ul>
      <ul class="rules" id="censor-rules"></ul>
      <div id="censor-log"></div>
    </section>
    <section id="netem"></section>
    <section>
      <h3>Secrets in the clear</h3>
      <textarea id="needles" placeholder="label = value, one per line&#10;uuid = 01234567-89ab-cdef-0123-456789abcdef"></textarea>
      <div class="row" style="display:flex;gap:10px;align-items:center;margin-top:6px">
        <button id="needles-apply">Watch</button><span class="hint" id="needles-state" style="margin:0"></span>
      </div>
      <p class="hint">Matched as text; UUIDs and hex also as raw bytes.</p>
      <div id="alarms"></div>
    </section>
    <section>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3 style="margin:0">Packets</h3>
        <button id="feed-pause">Pause</button>
      </div>
      <div id="feed"></div>
    </section>
  </div>

  <div class="splitter" role="separator" aria-orientation="vertical" tabindex="0" data-split="wire"
       aria-label="Width of the wire column"></div>
  <div class="zone" id="server">
    <div class="zone-head">
      <h2>Server <span class="addr" id="server-ip"></span></h2>
      <div class="endpoint">listen on <b id="server-listen"></b><span class="st" id="server-status"></span></div>
      <div class="folder" id="server-folder"></div>
    </div>
    <div class="term" id="term-server"></div>
    <div class="zone-foot"><button data-reconnect="server">Reconnect</button><span id="server-state"></span></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
const token = new URLSearchParams(location.search).get("t") || "";
const api = (path, body) => fetch(path, {
  method: body ? "POST" : "GET",
  headers: { "x-wirelab-token": token, "content-type": "application/json" },
  body: body ? JSON.stringify(body) : undefined,
}).then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); });
const wsUrl = path => `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}${path}${path.includes("?") ? "&" : "?"}t=${token}`;
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("en-US");

// Consoles. The size is fixed when a console connects: the remote terminal
// gets it once, so after resizing the window use "Reconnect".
const consoles = {};
function openConsole(zone) {
  const old = consoles[zone];
  if (old) { old.ws.close(); old.term.dispose(); }
  const term = new Terminal({ fontFamily: '"IBM Plex Mono", monospace', fontSize: 13, cursorBlink: false,
    theme: { background: "#1d1c1a", foreground: "#e8e3d8" } });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  const el = $("term-" + zone);
  el.innerHTML = "";
  term.open(el);
  fit.fit();
  const ws = new WebSocket(wsUrl(`/ws/term/${zone}?cols=${term.cols}&rows=${term.rows}`));
  ws.binaryType = "arraybuffer";
  const state = $(zone + "-state");
  ws.onopen = () => { state.textContent = `${term.cols}×${term.rows}`; term.focus(); };
  const entry = { term, ws, fit, cols: term.cols, rows: term.rows };
  ws.onmessage = e => term.write(typeof e.data === "string" ? e.data : new Uint8Array(e.data));
  ws.onclose = () => { state.textContent = "disconnected"; };
  term.onData(d => { if (ws.readyState === 1) ws.send(d); });
  consoles[zone] = entry;
}

// After a column changes width the terminal is refitted here, but the shell
// in the container keeps the size it was opened with until Reconnect.
function refitConsoles() {
  for (const [zone, c] of Object.entries(consoles)) {
    c.fit.fit();
    const state = $(zone + "-state");
    if (c.term.cols !== c.cols || c.term.rows !== c.rows) {
      state.innerHTML = "";
      const note = document.createElement("span");
      note.className = "term-note";
      note.textContent = `size now ${c.term.cols}×${c.term.rows}, the shell still has ${c.cols}×${c.rows}: Reconnect to apply`;
      state.append(note);
    } else state.textContent = `${c.cols}×${c.rows}`;
  }
}

const lab = document.querySelector(".lab");
const widths = { client: null, wire: null };
try { Object.assign(widths, JSON.parse(localStorage.getItem("wirelab-widths") || "{}")); } catch (e) {}
function applyWidths() {
  const total = lab.clientWidth - 14, minSide = 240, minWire = 280;
  if (widths.wire != null) widths.wire = Math.max(minWire, Math.min(widths.wire, total - 2 * minSide));
  if (widths.client != null) widths.client = Math.max(minSide, Math.min(widths.client, total - (widths.wire ?? 400) - minSide));
  lab.style.setProperty("--w-client", widths.client != null ? widths.client + "px" : "minmax(0, 1fr)");
  lab.style.setProperty("--w-wire", (widths.wire ?? 400) + "px");
}
function saveWidths() { try { localStorage.setItem("wirelab-widths", JSON.stringify(widths)); } catch (e) {} }
function currentWidths() {
  if (widths.client == null) widths.client = $("client").getBoundingClientRect().width;
  if (widths.wire == null) widths.wire = $("wire").getBoundingClientRect().width;
}
for (const sp of document.querySelectorAll(".splitter")) {
  const which = sp.dataset.split;
  sp.addEventListener("pointerdown", e => {
    currentWidths();
    sp.setPointerCapture(e.pointerId);
    sp.classList.add("dragging");
    const startX = e.clientX, start = widths[which];
    const move = ev => { widths[which] = start + ev.clientX - startX; applyWidths(); };
    const up = () => {
      sp.classList.remove("dragging");
      sp.removeEventListener("pointermove", move);
      sp.removeEventListener("pointerup", up);
      saveWidths();
      refitConsoles();
    };
    sp.addEventListener("pointermove", move);
    sp.addEventListener("pointerup", up);
  });
  sp.addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    currentWidths();
    widths[which] += (e.key === "ArrowRight" ? 1 : -1) * (e.shiftKey ? 80 : 20);
    applyWidths();
    saveWidths();
    refitConsoles();
  });
}
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { applyWidths(); refitConsoles(); }, 200); });
applyWidths();
document.querySelectorAll("[data-reconnect]").forEach(b => b.onclick = () => openConsole(b.dataset.reconnect));

// Impairments for the whole path. Delay and jitter are entered as round trip,
// the way ping reports them, and split evenly between the two directions.
const fields = [["rtt_ms", "delay (RTT), ms"], ["rtt_jitter_ms", "jitter (RTT), ms"], ["loss_pct", "loss, %"],
                ["duplicate_pct", "duplicate, %"], ["corrupt_pct", "corrupt, %"], ["rate_kbit", "rate, kbit/s"]];
const netem = $("netem");
netem.innerHTML = `<div class="dirblock"><div class="row"><h3 style="margin:0">Impairments (netem)</h3><button id="netem-apply">Apply</button></div>
  <div class="netem">${fields.map(([k, l]) => `<label>${l}<input type="number" min="0" step="any" value="0" id="netem-${k}"></label>`).join("")}</div>
  <div class="err" id="netem-err"></div>
  <p class="hint">Delay and jitter are halved for each direction. Loss, duplication and corruption apply in each direction, so 1% loss fails about 2% of round trips. Rate is per direction. All zeros remove the impairments; netem jitter reorders packets.</p>
  <div class="tc"><span class="c2s">c→s</span> <span id="c2s-tc"></span></div>
  <div class="tc"><span class="s2c">s→c</span> <span id="s2c-tc"></span></div></div>`;
function showQdisc(q) { for (const d of ["c2s", "s2c"]) $(d + "-tc").textContent = q[d] || ""; }
$("netem-apply").onclick = async () => {
  const body = {};
  for (const [k] of fields) body[k] = Number($("netem-" + k).value) || 0;
  $("netem-err").textContent = "";
  try { showQdisc((await api("/api/netem", body)).qdisc); }
  catch (e) {
    // A half-applied change comes back with both qdiscs as they now are.
    try { const j = JSON.parse(e.message); $("netem-err").textContent = j.error; showQdisc(j.qdisc); }
    catch (_) { $("netem-err").textContent = e.message; }
  }
};

$("needles-apply").onclick = async () => {
  const list = $("needles").value.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf("=");
    return i > 0 ? { label: l.slice(0, i).trim(), text: l.slice(i + 1).trim() } : { label: l.slice(0, 12), text: l };
  });
  try { const r = await api("/api/needles", list); $("needles-state").textContent = `watching ${r.watching}`; }
  catch (e) { $("needles-state").textContent = e.message; }
};

// Censor: presets come from containers/censor/presets; every rule shows the
// source it reproduces, and decisions arrive from the censor's own log.
let presets = [];
function sourceLinks(src) {
  const frag = document.createDocumentFragment();
  const parts = (src || "").split(/(https?:\/\/\S+)/);
  for (const part of parts) {
    if (/^https?:\/\//.test(part)) {
      const a = document.createElement("a");
      a.href = part; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = new URL(part).hostname;
      frag.append(a);
    } else frag.append(document.createTextNode(part));
  }
  return frag;
}
function showHypotheses(preset, chosen) {
  const ul = $("censor-hyps");
  ul.innerHTML = "";
  for (const h of (preset && preset.hypotheses) || []) {
    const li = document.createElement("li");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.dataset.hyp = h.id; cb.id = "hyp-" + h.id;
    cb.checked = chosen && h.id in chosen ? chosen[h.id] : h.default;
    const label = document.createElement("label");
    label.htmlFor = cb.id; label.textContent = "Hypothesis: " + h.label;
    const note = document.createElement("span");
    note.className = "src"; note.textContent = h.note;
    li.append(cb, label, note);
    ul.append(li);
  }
}
function showRules(preset, disabled) {
  const ul = $("censor-rules");
  ul.innerHTML = "";
  $("censor-notes").textContent = preset ? `${preset.name}, as of ${preset.as_of}. ${preset.notes || ""}` : "Off: traffic passes untouched.";
  if (!preset) return;
  for (const r of preset.rules) {
    const li = document.createElement("li");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.dataset.rule = r.id; cb.checked = !(disabled ? disabled.includes(r.id) : r.disabled);
    cb.id = "rule-" + r.id;
    const label = document.createElement("label");
    label.htmlFor = cb.id; label.textContent = r.name;
    const src = document.createElement("span");
    src.className = "src"; src.append(sourceLinks(r.source));
    li.append(cb, label, src);
    ul.append(li);
  }
}
async function loadCensor() {
  const c = await api("/api/censor");
  if (!c.available) {
    $("censor-err").textContent = "This lab runs without the censor. Build wl-censor, then lab down and lab up.";
    $("censor-apply").disabled = true;
  }
  presets = c.presets.filter(p => !p.error);
  const sel = $("censor-preset");
  for (const p of presets) { const o = document.createElement("option"); o.value = p.file; o.textContent = p.name; sel.append(o); }
  const active = c.active && presets.find(p => p.name === c.active.name);
  sel.value = active ? active.file : "";
  const shown = active ? presets.find(p => p.file === sel.value) : null;
  showRules(shown, c.active ? c.active.rules.filter(r => r.disabled).map(r => r.id) : null);
  const chosen = {};
  for (const h of (c.active && c.active.hypotheses) || []) if ("chosen" in h) chosen[h.id] = h.chosen;
  showHypotheses(shown, chosen);
  sel.onchange = () => {
    const p = presets.find(p => p.file === sel.value) || null;
    showRules(p, null);
    showHypotheses(p, null);
  };
}
$("censor-apply").onclick = async () => {
  $("censor-err").textContent = "";
  const file = $("censor-preset").value || null;
  const disabled = [...document.querySelectorAll("#censor-rules input")].filter(i => !i.checked).map(i => i.dataset.rule);
  const hypotheses = {};
  for (const i of document.querySelectorAll("#censor-hyps input")) hypotheses[i.dataset.hyp] = i.checked;
  try { await api("/api/censor", { file, disabled, hypotheses }); }
  catch (e) { $("censor-err").textContent = e.message; }
};
function addCensorEvents(events) {
  const log = $("censor-log");
  for (const e of events) {
    const d = document.createElement("div");
    const hit = !["start", "preset", "expired", "error"].includes(e.action);
    d.className = hit ? "hit" : "";
    const t = new Date(e.t).toLocaleTimeString("en-GB");
    const what = document.createElement("span");
    what.className = "what";
    what.textContent = hit ? `${e.rule}: ${e.action}` : e.action;
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = ` ${t}${e.flow ? " · " + e.flow : ""}`;
    d.append(what, meta);
    if (e.detail) { const det = document.createElement("div"); det.style.border = "0"; det.style.padding = "0"; det.textContent = e.detail; d.append(det); }
    if (hit && e.source) d.title = e.source;
    log.prepend(d);
  }
  while (log.childElementCount > 150) log.lastElementChild.remove();
}

// Packet feed.
const feed = $("feed");
let paused = false;
$("feed-pause").onclick = e => { paused = !paused; e.target.textContent = paused ? "Resume" : "Pause"; };
function rowEl(r) {
  const d = document.createElement("div");
  d.className = `p ${r.dir}${r.alarm ? " alarm" : ""}`;
  const cells = [r.n, r.t_ms.toFixed(1), r.dir === "c2s" ? "c→s" : "s→c", r.len, r.payload, r.entropy ?? ""];
  d.innerHTML = cells.map((c, i) => `<span${i === 2 ? ' class="d"' : ""}></span>`).join("");
  [...d.children].forEach((s, i) => s.textContent = cells[i]);
  d.title = `${r.proto} ${r.sport} → ${r.dport}, IP bytes ${r.len}, payload ${r.payload}` + (r.entropy != null ? `, entropy ${r.entropy} bits/byte` : "");
  if (r.note) { const n = document.createElement("span"); n.className = "note"; n.textContent = r.note; d.append(n); }
  return d;
}
function addRows(rows, dropped) {
  if (paused && !rows.some(r => r.alarm)) return;
  const frag = document.createDocumentFragment();
  for (const r of rows) frag.append(rowEl(r));
  if (dropped) { const g = document.createElement("div"); g.className = "gap"; g.textContent = `${fmt(dropped)} more packets without notes not shown`; frag.append(g); }
  feed.prepend(frag);
  while (feed.childElementCount > 400) feed.lastElementChild.remove();
}
function showCounts(c) {
  $("c2s-p").textContent = fmt(c[0].packets); $("c2s-b").textContent = fmt(c[0].ip_bytes);
  $("s2c-p").textContent = fmt(c[1].packets); $("s2c-b").textContent = fmt(c[1].ip_bytes);
}
function wireStream() {
  const ws = new WebSocket(wsUrl("/ws/wire"));
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    showCounts(m.counts);
    $("capture-state").textContent = "capture: " + m.capture;
    if (m.type === "snapshot") {
      feed.innerHTML = "";
      addRows(m.rows.slice().reverse(), 0);
      $("alarms").innerHTML = "";
      for (const a of m.alarms) { const d = document.createElement("div"); d.textContent = a; $("alarms").append(d); }
      $("needles").value = m.needles.map(n => `${n.label} = ${n.text}`).join("\n");
      $("censor-log").innerHTML = "";
      addCensorEvents(m.censor || []);
    } else {
      addRows(m.rows.slice().reverse(), m.dropped_rows);
      if (m.censor && m.censor.length) addCensorEvents(m.censor);
      for (const r of m.rows.filter(r => r.alarm)) { const d = document.createElement("div"); d.textContent = r.note; $("alarms").prepend(d); }
    }
  };
  ws.onclose = () => { $("capture-state").textContent = "lost the panel connection, retrying in 2 s"; setTimeout(wireStream, 2000); };
}

api("/api/lab").then(l => {
  $("client-ip").textContent = l.client.ip;
  $("server-ip").textContent = l.server.ip;
  $("client-folder").textContent = `/lab = ${l.client.folder}`;
  $("server-folder").textContent = `/lab = ${l.server.folder} · target ${l.server.target}`;
  $("client-connect").textContent = l.client.connect;
  $("server-listen").textContent = l.server.listen;
  $("lab-meta").textContent = `lab ${l.id} · ${l.base} · env WL_SERVER_ADDR, WL_SERVER_PORT · session ${l.session}`;
  showQdisc(l.qdisc);
  openConsole("client");
  openConsole("server");
  wireStream();
  pollStatus(l.port);
  loadCensor().catch(e => { $("censor-err").textContent = e.message; });
}).catch(e => { document.body.textContent = "The panel did not answer: " + e.message; });

// Whether the server listens on the lab port and the client is connected,
// read from the containers' socket tables every 2 s.
async function pollStatus(port) {
  const set = (id, text, on) => { const el = $(id); el.textContent = text; el.classList.toggle("on", on); };
  try {
    const s = await api("/api/status");
    if (s.listening_error) set("server-status", "status unavailable: " + s.listening_error, false);
    else if (s.listening.length) set("server-status", "listening (" + s.listening.join(", ") + ")", true);
    else set("server-status", `nothing listens on tcp or udp ${port}`, false);
    if (s.client_error) set("client-status", "status unavailable: " + s.client_error, false);
    else if (s.client_connections.length) set("client-status", `connected: ${s.client_connections.join(", ")}`, true);
    else set("client-status", "no connected tcp or udp socket", false);
  } catch (e) { set("server-status", "status unavailable: " + e.message, false); }
  setTimeout(() => pollStatus(port), 2000);
}
